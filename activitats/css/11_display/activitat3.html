<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Menú Horizontal</title>
<style>
  nav ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    gap: 10px;
  }

  nav li a {
    display: block;
    padding: 10px 15px;
    background: #1e3c72;
    color: white;
    text-decoration: none;
    border-radius: 5px;
  }

  nav li a:hover {
    background: #16305a;
  }
</style>
</head>
<body>

<h1>Activitat 3:</h1>

<header>
  <nav>
    <ul>
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Servicios</a></li>
      <li><a href="#">Portfolio</a></li>
      <li><a href="#">Contacto</a></li>
    </ul>
  </nav>
</header>

</body>
</html>
