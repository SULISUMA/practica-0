<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de comentarios</title>

<style>

/* Bloque comentarios */
.comentarios{
    width: 400px;
    font-family: Arial, sans-serif;
}

/* Bloque comentario */
.comentario{
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 10px;
}

/* Elementos del comentario */
.comentario__autor{
    font-weight: bold;
}

.comentario__texto{
    margin-top: 5px;
}

.comentario__fecha{
    font-size: 12px;
    color: gray;
}

</style>

</head>

<body>

<h1>Activitat 2:</h1>

<section class="comentarios">

<div class="comentario">
<div class="comentario__autor">Ana</div>
<div class="comentario__texto">Me ha gustado mucho este artículo.</div>
<div class="comentario__fecha">05/03/2026</div>
</div>

<div class="comentario">
<div class="comentario__autor">Carlos</div>
<div class="comentario__texto">Muy interesante, gracias por compartir.</div>
<div class="comentario__fecha">05/03/2026</div>
</div>

</section>

</body>
</html>
