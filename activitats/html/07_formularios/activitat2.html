<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
</head>
<body>

  <h1>Activitat 2:</h1>

  <h1>Tienda de Altavoces</h1>

  <form>

    <p>
      <label>Modelo:</label>
      <select name="modelo">
        <option>SR1</option>
        <option>R4</option>
        <option>R5</option>
      </select>
    </p>

    <p>
      <label>Potencia máxima (50 - 100):</label>
      <input type="number" name="potencia" min="50" max="100">
    </p>

    <p>
      <label>¿Bluetooth?</label>
      <input type="radio" name="bluetooth" value="si"> Sí
      <input type="radio" name="bluetooth" value="no"> No
    </p>

    <p>
      <label>Color:</label>
      <input type="color" name="color">
    </p>

    <p>
      <button type="submit">Enviar</button>
    </p>

  </form>

</body>
</html>
