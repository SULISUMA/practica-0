<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat Básico</title>
    <style>
        body { font-family: Arial; background: #f0f0f0; padding: 20px; }
        .mensaje { display: flex; margin-bottom: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; }
        .contenido { background: #ddd; padding: 5px 10px; border-radius: 10px; }
        .otros { flex-direction: row-reverse; }
        .otros .contenido { background: #cfc; margin-right:0; margin-left:10px; }
    </style>
</head>
<body>

<h1>Activitat 1:</h1>

<div class="mensaje">
    <img src="https://i.pravatar.cc/40?img=1" class="avatar">
    <div class="contenido">
        Ana<br><small>4/3/26</small><br>¡Hola! ¿Cómo estás?
    </div>
</div>

<div class="mensaje otros">
    <img src="https://i.pravatar.cc/40?img=2" class="avatar">
    <div class="contenido">
        Luis<br><small>4/3/26</small><br>¡Hola Ana! Todo bien.
    </div>
</div>

</body>
</html>
