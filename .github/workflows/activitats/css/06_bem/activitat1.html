<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Header con BEM</title>

<style>

.header{
    background-color: #2c3e50;
    color: white;
    padding: 15px;
}

.header__logo{
    font-size: 24px;
    font-weight: bold;
}

.header__nav{
    margin-top: 10px;
}

.header__list{
    list-style: none;
    padding: 0;
}

.header__link{
    color: white;
    margin-right: 15px;
    text-decoration: none;
}

.header__search{
    margin-top: 10px;
}

.header__input{
    padding: 5px;
}

.header__button{
    padding: 5px 10px;
}

</style>

</head>

<body>

<h1>Activitat 1:</h1>

<header class="header">

<div class="header__logo">
MiLogo
</div>

<nav class="header__nav">
<ul class="header__list">
<li><a href="#" class="header__link">Inicio</a></li>
<li><a href="#" class="header__link">Servicios</a></li>
<li><a href="#" class="header__link">Contacto</a></li>
</ul>
</nav>

<form class="header__search">
<input type="text" class="header__input" placeholder="Buscar...">
<button class="header__button">Buscar</button>
</form>

</header>

</body>
</html>
